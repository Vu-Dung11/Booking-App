<div class="toast-container">
  @for (t of toasts(); track t.id) {
    <div class="toast" [class.toast-success]="t.type === 'success'"
         [class.toast-error]="t.type === 'error'"
         [class.toast-info]="t.type === 'info'">
      <div class="toast-icon">
        @if (t.type === 'success') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 4L6 11.5L2.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        } @else if (t.type === 'error') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3M8 10.5h.007" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v4M8 5.5h.007" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        }
      </div>
      <span class="toast-message">{{ t.message }}</span>
      <button class="toast-close" (click)="dismiss(t.id)" aria-label="Close">&times;</button>
    </div>
  }
</div>
